<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表单</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, sans-serif;
      background-color: #f5f7fa;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 90%;
      max-width: 480px;
      background: #ffffff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }
    .title {
      font-size: 22px;
      color: #222;
      margin-bottom: 30px;
      text-align: center;
    }
    .input-box {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #d2d6dc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border 0.2s;
    }
    .input-box:focus {
      border-color: #4080ff;
    }
    .submit-btn {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: none;
      background-color: #4080ff;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .submit-btn:hover {
      background-color: #2b6ed9;
    }
    .tip {
      margin-top: 20px;
      text-align: center;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="title">数据上传</div>
    <input id="contentInput" class="input-box" placeholder="在此输入内容">
    <button class="submit-btn" onclick="submitData()">确认上传</button>
    <div class="tip" id="msg"></div>
  </div>

  <script>
    async function submitData() {
      const inputEle = document.getElementById("contentInput");
      const msgEle = document.getElementById("msg");
      const value = inputEle.value.trim();
      if (!value) {
        msgEle.innerText = "请输入内容";
        msgEle.style.color = "#e53e3e";
        return;
      }
      msgEle.innerText = "正在提交...";
      msgEle.style.color = "#666";

      try {
        const res = await fetch("/api/submit", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            data: value
          })
        });
        const result = await res.json();
        if (res.ok) {
          msgEle.innerText = "上传成功！";
          msgEle.style.color = "#28a745";
          inputEle.value = "";
        } else {
          msgEle.innerText = "上传失败：" + result.message;
          msgEle.style.color = "#e53e3e";
        }
      } catch (err) {
        msgEle.innerText = "网络请求出错";
        msgEle.style.color = "#e53e3e";
      }
    }
  </script>
</body>
</html>
